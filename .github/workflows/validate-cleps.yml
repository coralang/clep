name: Validate CLEPs

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML dependency
        run: python -m pip install PyYAML

      # A null CLEP ID is assigned in the validation workspace for PR checks.
      # The push job below persists the same assignment after the PR is merged.
      - name: Assign IDs and organize proposals
        run: python scripts/prepare_cleps.py

      - name: Validate proposal metadata
        run: python scripts/validate_cleps.py

      - name: Check README proposal directory
        run: python scripts/update_readme.py
        if: github.event_name == 'pull_request'

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Lint proposal Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        if: hashFiles('proposals/**/*.md') != ''
        with:
          globs: "proposals/**/*.md"

  publish-index:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML dependency
        run: python -m pip install PyYAML

      - name: Assign IDs and organize proposals
        run: python scripts/prepare_cleps.py

      - name: Validate proposal metadata
        run: python scripts/validate_cleps.py

      - name: Update README proposal directory
        run: python scripts/update_readme.py

      - name: Commit generated proposal updates
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals README.md
          git commit -m "chore: assign CLEP IDs and refresh proposal index"
          git push
